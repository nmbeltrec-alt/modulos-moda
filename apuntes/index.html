*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
a{color:inherit}
.wrap{max-width:780px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-size:14px}
.top a{text-decoration:none;font-weight:600}
.top .who{color:var(--muted);font-size:12px;text-align:right}
.top button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
h1{font-family:var(--f-display);font-size:clamp(32px,6vw,46px);margin:8px 0 4px}
.lede{color:var(--muted);margin:0 0 18px;font-size:16px}

.gbtn{font:inherit;font-size:16px;font-weight:600;padding:11px 22px;border-radius:999px;border:0;background:var(--fg);color:var(--paper);cursor:pointer}

<div class="wrap">
  <div class="top"><a href="../">← Mis módulos</a><span class="who"><span id="who"></span> <button type="button" id="out" hidden>Cerrar sesión</button></span></div>
  <h1>Apuntes de clase</h1>
  <p class="lede">Tus apuntes de todas las clases, enlazados a los temas, resaltados y notas de cualquier módulo.</p>
  <div id="gate" class="gate"><p id="gmsg">Cargando…</p><button type="button" id="gLogin" class="gbtn" hidden>Entrar con Google</button></div>
  <div id="root" hidden></div>
</div>
<script src="../firebase-config.js?v=20261111a"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, memoryLocalCache, doc, getDoc, getDocsFromServer, setDoc, deleteDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const APV = '20261111a';
const $ = id => document.getElementById(id);
const say = t => { $('gmsg').textContent = t; };
if (!window.FIREBASE_CONFIG) { say('Falta la configuración de Firebase.'); throw new Error('no config'); }
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const fs = initializeFirestore(app, { localCache: memoryLocalCache(), experimentalForceLongPolling: true });
setPersistence(auth, browserLocalPersistence).catch(() => {});
getRedirectResult(auth).catch(e => say('No se pudo iniciar sesión: ' + (e.code || e.message)));
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'tiempo-agotado' }), ms))]);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function apx(uid){
  const col = n => collection(fs, 'users', uid, n);
  const toMap = s => { const m = new Map(); s.docs.forEach(d => m.set(d.id, d.data())); return m; };
  let code = null;
  async function getCode(){
    if (code) return code;
    try { code = localStorage.getItem('m1-code'); } catch (e) {}
    if (!code) { const s = await getDoc(doc(fs, 'users', uid, 'priv', 'acceso')); if (s.exists()) code = s.data().code; }
    return code;
  }
  return { uid, mod: null, base: '../', root: $('root'),
    watch(n, next, err){
      const c = col(n); const unsub = onSnapshot(c, s => next(toMap(s)), err);
      const pull = () => withTimeout(getDocsFromServer(c), 20000).then(s => next(toMap(s))).catch(() => {});
      setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 60000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
      return unsub;
    },
    list: n => withTimeout(getDocsFromServer(col(n)), 20000).then(toMap),
    put: (n, id, d) => setDoc(doc(col(n), id), d),
    del: (n, id) => deleteDoc(doc(col(n), id)),
    // lee los títulos de los temas de un módulo que aún no se ha abierto (con tu código de acceso)
    async moduleHtml(slug){
      const c = await getCode(); if (!c) throw new Error('sin código');
      const m = await (await fetch('../' + slug + '/version.json', { cache: 'no-store' })).json();
      const norm = c.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(m.salt), iterations: m.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const u = new Uint8Array(await (await fetch('../' + slug + '/content.bin?v=' + m.v)).arrayBuffer());
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12));
      return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }
  };
}

$('gLogin').onclick = async () => {
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request') await signInWithRedirect(auth, p);
    else if (e.code !== 'auth/popup-closed-by-user') say('No se pudo iniciar sesión (' + e.code + ').');
  }
};
$('out').onclick = async () => { try { localStorage.removeItem('m1-code'); } catch (e) {} await signOut(auth); location.reload(); };

let started = false;
onAuthStateChanged(auth, user => {
  if (!user) { say('Entra con tu cuenta de Google para ver tus apuntes.'); $('gLogin').hidden = false; return; }
  if (started) return; started = true;
  $('gate').hidden = true; $('root').hidden = false; $('who').textContent = user.email || ''; $('out').hidden = false;
  window.APX = apx(user.uid);
  const s = document.createElement('script'); s.src = '../apuntes.js?v=' + APV; document.body.appendChild(s);
});
</script>
</body></html>
